<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奶龙交通大学 · 群聊</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #ececec;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: 2px;
    }
    .hint {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(100%, 560px);
      max-height: 76vh;
      max-height: 76dvh;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>奶龙交通大学</h1>
    <p class="hint">扫一扫二维码，加入群聊</p>
    <img src="./qrcode.png" alt="洗脚奶龙奶蛙总部 群二维码" width="1284" height="2277" decoding="async">
  </div>
</body>
</html>
